infrastructure_allocation = "One Ubuntu 22.04 bare-metal node with root (>=8 cores, 32 GB RAM, 20 GB disk); e.g., a CloudLab c6525-25g, xl170, or m510 node type. A single node suffices for the one-day evaluation path."
install_script = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/install.sh"
use = "Research artifact for a semi-honest two-party MPC kernel (bounded-slot aggregation + oblivious Top-K) evaluated in MP-SPDZ semi2k. It is a measured kernel, not an end-to-end application: no malicious security or multi-invocation composition is claimed. The included VolePSI-based CPSI frontend is used to generate bounded-slot share files but is outside the measured MPC-online kernel. Wall-clock timings are environment-dependent; communication volumes and preprocessing estimates are exact-reproduction targets, while round counts may exhibit the documented small MP-SPDZ runtime batching variation."
destructive = "Installation may use sudo to install required apt packages and creates or updates the MP-SPDZ tree under $MPSPDZ_DIR. During experiment execution, the WAN stages of scripts/rerun_camera_ready.sh temporarily install a tc netem qdisc on the loopback interface (requires sudo) and remove it on exit, including on interruption. Other evaluation scripts write only within the artifact results directory, $MPSPDZ_DIR/Programs, and $MPSPDZ_DIR/Player-Data."
claim1 = "C1 Correctness: bounded one-to-many aggregation is computed correctly over injected multi-hit rows (paper Table 9), and all variants agree on the Top-K output for identical share files."
script1 = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/verify_functional.sh"
expected1 = "Steps S2 and S4 report PASS: identical (rank, valid, score) rows across variants, and rows CSV,3,1,321 / CSV,6,1,657 / CSV,9,1,139 in the F.1 run. Reference transcript: results/functional_verify/SUMMARY.txt."
claim2 = "C2 Fail-closed overflow handling: with an injected row-overflow indicator the kernel reveals the global overflow indicator and aborts before releasing any retained Top-K entries (paper Appendix F.2)."
script2 = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/verify_functional.sh"
expected2 = "Step S3 reports PASS: the run log contains '[FATAL] Global overflow triggered' and zero TOPK_CSV lines."
claim3 = "C3 Injectivity of the packed (valid, score, tie) ranking-value encoding (paper Appendix F.3)."
script3 = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/verify_key_encoding.py"
expected3 = "Output ends with '[CONCLUSION] Key encoding is INJECTIVE across all tested ranges' and exit code 0 (33,554,432 exhaustive cases at the historical width plus 10^6 random trials at each production width). Runs on any machine; no MP-SPDZ needed."
claim4 = "C4 Fixed-shape deterministic cost: communication volumes and compile-time preprocessing estimates are determined by the compiled program and public parameters and reproduce exactly (paper Tables 4, 5, 8, 12, 13); round counts are deterministic at the protocol level up to small MP-SPDZ runtime batching variation; all are independent of the match density (Table 14)."
script4 = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/rerun_camera_ready.sh"
expected4 = "After 'bash scripts/rerun_camera_ready.sh' (LAN stages t4 t5 t8 t13; Table 12 is the N=8192 point of t5) and 'python3 scripts/compare_camera_ready.py', the global_MB and Table 8 counts in results/camera_ready_rerun/t*.csv equal the shipped expected-results CSVs exactly and the rounds match up to a few rounds of runtime batching variation. The optional 't14' stage (needs the VolePSI frontend, WITH_VOLEPSI=1 install) shows identical communication/rounds across densities; its expected results ship in the package. The generated camera_ready_diff.md shows the published-to-reproduced deltas."
claim5 = "C5 Relative performance trends: under LAN the all-Boolean Queue/Select variants are fastest and H-Sort slowest with the paper's scaling across N; under WAN the runtime is round-dominated and the fastest realization shifts from B-Queue to H-Sort (paper Tables 4-6, 12, 15, 16)."
script5 = "https://github.com/blindstep-ae/blindstep-artifact/blob/main/scripts/rerun_camera_ready.sh"
expected5 = "LAN ordering from the t4/t5 stages matches the paper; 'bash scripts/rerun_camera_ready.sh rtt' (scaled-down WAN, ~2 h) shows H-Sort faster than B-Queue at both 25 ms and 50 ms RTT despite ~100x more communication; combined with the LAN result where B-Queue is faster, this establishes the reported crossover. Optional 'wan6 wan2048' stages reproduce the full WAN tables. Absolute seconds are environment-dependent; trends are the target (see results/camera_ready_rerun/NOTES.md)."
hw = "x86-64 Linux host; about 8 cores, 32 GB RAM (peak: MP-SPDZ compilation at N=8192), 20 GB free disk.\nNo GPU. Both MPC parties run on the same host over loopback; no external network access at run time.\nWAN stages need root on the host for tc netem on the loopback interface (bare-metal or VM with root; CloudLab/Chameleon recommended)."
sw = "Ubuntu 22.04 LTS (tested). MP-SPDZ at commit 58d2739ac251262c0bd6034f7fc7d0666a6b1e2c (v0.4.2-13-g58d2739a) with the semi2k protocol built (semi2k-party.x), located via the MPSPDZ_DIR environment variable; scripts/install.sh checks out and builds this exact commit.\nPython 3.8+ (standard library only).\nOptional, for the match-density sweep only: CMake >= 3.15 (Ubuntu 22.04's apt cmake 3.22 suffices) / C++17 toolchain to build the bundled VolePSI frontend from the included patch (WITH_VOLEPSI=1 scripts/install.sh); all other experiments use a byte-aligned Python simulator of the frontend's share-file format.\nsudo for apt packages at install time and for tc netem in the WAN stages."
